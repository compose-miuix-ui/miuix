name: Publish to GitHub Packages

on:
  push:
    branches: ["main"]
    tags: ["*"]
    paths:
      - "miuix-core/**"
      - "miuix-ui/**"
      - "miuix-preference/**"
      - "miuix-material/**"
      - "miuix-blur/**"
      - "miuix-glass/**"
      - "miuix-glass-icons/**"
      - "miuix-squircle/**"
      - "miuix-icons/**"
      - "miuix-nav/**"
      - "miuix-window/**"
      - "build-logic/**"
      - "gradle/**"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish_snapshot:
    runs-on: ubuntu-latest
    if: github.ref_type == 'branch'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Sources
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          gradle-home-cache-cleanup: true
      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v6
        with:
          path: ~/.konan
          key: ${{ runner.os }}-konan-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: ${{ runner.os }}-konan-
      - name: Build and stage SNAPSHOT publications
        run: ./gradlew --parallel --stacktrace publishAllPublicationsToLocalRepository --no-configuration-cache
        env:
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Publish SNAPSHOT to GitHub Packages
        run: ./gradlew --no-parallel --stacktrace publishAllPublicationsToGithubRepository --no-configuration-cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Clean up incomplete SNAPSHOT packages on failure or cancellation
        if: failure() || cancelled()
        run: bash .github/scripts/cleanup_packages.sh failed
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Prune old SNAPSHOT package versions
        if: success()
        run: bash .github/scripts/cleanup_packages.sh prune
        env:
          GITHUB_TOKEN: ${{ github.token }}
          KEEP_SNAPSHOTS: "10"
