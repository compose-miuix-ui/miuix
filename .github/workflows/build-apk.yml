name: Build APK (Android Demo)

on:
  push:
    branches: [android]
    paths:
      - 'android-demo/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-demo

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Configure signing (secrets or auto-generated)
        id: signing
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_PATH }}" ]; then
            echo "Using secrets for signing"
            echo "KEYSTORE_PATH=${{ secrets.KEYSTORE_PATH }}" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=${{ secrets.KEYSTORE_PASS }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"
          else
            echo "Generating release keystore with default password"
            PASSWORD="miuixdemo"
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/release.jks" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -alias miuixdemo \
              -storepass "$PASSWORD" \
              -keypass "$PASSWORD" \
              -dname "CN=Miuix Demo, OU=Demo, O=Miuix, L=City, S=State, C=CN"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASS=$PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=miuixdemo" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$PASSWORD" >> "$GITHUB_ENV"
          fi

      - name: Build Debug + Release APK
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: miuix-demo-apk
          path: |
            android-demo/app/build/outputs/apk/debug/*.apk
            android-demo/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Create GitHub Release (on tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android-demo/app/build/outputs/apk/debug/*.apk
            android-demo/app/build/outputs/apk/release/*.apk
          generate_release_notes: true